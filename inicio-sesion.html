<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <!-- CDN de Bootstrap 5.3.2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.inicio.css">
</head>

<body>

    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">

            <!-- LADO IZQUIERDO CON COLOR DE FONDO -->
            <header class="col-md-6 bg-cobalto p-4">
                <nav>
                    <ul class="list-unstyled m-0">
                        <li><a href="index.html" class="text-white text-decoration-none fw-bold">Volver</a></li>
                    </ul>
                </nav>
            </header>

            <!-- LADO DERECHO CON FORMULARIO CENTRADO -->
            <div class="col-md-6 d-flex justify-content-center align-items-center p-3">
                <nav id="inicio-sesion">
                    <div>
                        <form class="px-4 py-3">
                            <div class="mb-3">
                                <label for="exampleDropdownFormEmail1" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="exampleDropdownFormEmail1" placeholder="email@example.com">
                            </div>
                            <div class="mb-3">
                                <label for="exampleDropdownFormPassword1" class="form-label">Password</label>
                                <input type="password" class="form-control" id="exampleDropdownFormPassword1" placeholder="Password">
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="dropdownCheck">
                                    <label class="form-check-label" for="dropdownCheck">
                                        Remember me
                                    </label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item text-center" href="#">Eres nuevo por aqui? Registrate </a>
                        <a class="dropdown-item text-center" href="#">Olvidaste tu contraseña</a>
                    </div>
                </nav>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
