<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Trabajador/a - Privelink</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form id="registro-trabajadora">
    <h2>Registro de Trabajador/a</h2>

    <div class="campo">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="campo">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>
    </div>

    <div class="campo">
      <label for="apodo">Nombre Artístico / Apodo:</label>
      <input type="text" id="apodo" name="apodo" required>
    </div>

    <div class="campo">
      <label for="edad">Edad:</label>
      <input type="number" id="edad" name="edad" min="18" required>
    </div>

    <div class="campo">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" required>
    </div>

    <div class="campo">
      <label for="comuna">Comuna:</label>
      <input type="text" id="comuna" name="comuna" required>
    </div>

    <div class="campo-completo">
      <label for="descripcion">Sobre mí (Descripción):</label>
      <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
    </div>

    <div class="campo">
      <label for="tarifas">Tarifas / Precios:</label>
      <input type="text" id="tarifas" name="tarifas" placeholder="Ej: $30.000 / hora">
    </div>

    <div class="campo">
      <label for="fotos">Subir Fotos:</label>
      <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
    </div>

    <button type="submit">Registrarme</button>
  </form>

</body>
</html>
